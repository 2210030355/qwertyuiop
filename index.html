<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#181d3a"><title>Venna Reddy vs TCS 🎂</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10132c;font-family:Impact,'Arial Black',system-ui,sans-serif;touch-action:none}#game{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;color:#fff;text-shadow:3px 3px #18132d;z-index:2}.hud h1{font-size:clamp(18px,5.2vw,26px);margin:0;letter-spacing:.5px;transform:rotate(-2deg)}.score{font-size:17px;margin-top:8px;color:#ffeb85}.hint{position:fixed;bottom:calc(34px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:12px 19px;border:3px solid #20172e;border-radius:14px;background:#fff1a1;box-shadow:4px 5px #17142a;color:#251a2d;font-size:14px;white-space:nowrap;z-index:2;pointer-events:none;animation:bob 1s infinite alternate} @keyframes bob{to{transform:translate(-50%,-8px)}}
#overlay{display:none;position:fixed;inset:0;z-index:4;background:rgba(18,11,35,.65);overflow:hidden}#overlay.show{display:block}.lose{position:absolute;top:17%;left:5%;width:90%;text-align:center;color:#fff;text-shadow:3px 4px #272044;transform:rotate(-3deg)}.lose h2{font-size:clamp(31px,9vw,47px);margin:0;color:#ffdc63;line-height:1.1}.lose p{font:800 16px/1.5 system-ui,sans-serif;margin:11px 0}.egg-holder{position:absolute;left:50%;top:-190px;translate:-50% 0;width:140px;height:175px;display:none;cursor:pointer;touch-action:manipulation;z-index:5;filter:drop-shadow(0 13px 0 #18142e)}.egg-holder.drop{display:block;animation:eggdrop 1s cubic-bezier(.18,.85,.3,1.07) forwards}.egg-shape{width:100%;height:100%;background:radial-gradient(circle at 30% 20%,#fff 2%,#fff4dc 46%,#f6b866 96%);border:5px solid #2a1d36;border-radius:51% 49% 48% 52%/62% 61% 39% 38%;position:relative}.egg-shape:after{content:'?';position:absolute;inset:32% 0 0;text-align:center;font-size:65px;color:#ea6997;text-shadow:2px 3px #7d305b}.egg-holder.hit{animation:shake .23s ease}.egg-holder.hit .egg-shape{background:radial-gradient(circle,#fff,#ffe6a9)}.egg-caption{color:white;position:absolute;top:187px;left:50%;translate:-50% 0;width:230px;text-align:center;font:900 16px/1.35 system-ui,sans-serif;text-shadow:2px 3px #211526}.egg-holder.crack{animation:crack .3s ease forwards}@keyframes eggdrop{0%{top:-190px;rotate:-20deg}70%{top:60%;rotate:12deg}86%{top:52%;rotate:-6deg}100%{top:56%;rotate:0}}@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(13deg)}75%{transform:rotate(-13deg)}}@keyframes crack{to{transform:scale(1.45);opacity:0}}#surprise{display:none;position:absolute;left:50%;top:62%;width:min(72vw,310px);z-index:7;transform:translate(-50%,-50%) scale(.12) rotate(0);pointer-events:none}#surprise.fly{display:block;animation:flyup 4s cubic-bezier(.22,.78,.24,1) forwards}#surprise .photo{width:100%;aspect-ratio:386/520;object-fit:cover;display:block;border:9px solid white;outline:5px solid #241735;border-radius:10px;box-shadow:11px 15px #241735}#surprise .ribbon{position:absolute;left:-13%;right:-13%;bottom:-22px;background:#ffdc5b;color:#28112e;border:4px solid #291b36;text-align:center;transform:rotate(-5deg);padding:9px 2px;font-size:clamp(16px,5.7vw,25px);box-shadow:5px 6px #1d1530;white-space:nowrap}@keyframes flyup{0%{top:75%;transform:translate(-50%,-50%) scale(.08) rotate(0);opacity:0}15%{opacity:1}70%{top:37%;transform:translate(-50%,-50%) scale(.9) rotate(720deg)}100%{top:37%;transform:translate(-50%,-50%) scale(.95) rotate(1080deg);opacity:1}}#replay{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;translate:-50% 0;display:none;background:#e9f59a;color:#23172d;border:4px solid #251830;box-shadow:5px 6px #19122a;border-radius:10px;padding:12px 23px;font:900 16px system-ui,sans-serif;z-index:9}#replay.show{display:block}.confetto{position:absolute;top:-25px;width:11px;height:19px;z-index:6;animation:rain linear forwards}@keyframes rain{to{transform:translateY(115vh) rotate(800deg)}}.desktop{display:none}@media(min-width:700px){.desktop{display:grid;position:fixed;inset:0;place-items:center;background:#14142c;color:white;z-index:100;text-align:center;padding:40px;font:700 24px system-ui}}
</style>
</head>
<body>
<canvas id="game"></canvas><header class="hud"><h1>VENNA REDDY vs TCS 🏢</h1><div class="score" id="score">Towers escaped: 0</div></header><div class="hint" id="hint">👆 TAP TO FLY, BIRTHDAY BOY!</div>
<div id="overlay"><div class="lose" id="lose"><h2>AYYO! CAUGHT BY TCS 💀</h2><p>Office lo join avvakamunde crash ayyava? 😂<br>Something is falling from the sky...</p></div><div class="egg-holder" id="egg"><div class="egg-shape"></div><div class="egg-caption" id="eggText">🥚 TAP THE EGG TWICE!</div></div><div id="surprise"><img class="photo" src="venna.png" alt="Venna Reddy"><div class="ribbon">HAPPY BIRTHDAY VENNA! 🎂</div></div><button id="replay">PLAY AGAIN 🔁</button></div><div class="desktop">📱 Open this birthday surprise on a phone!</div>
<script>
(()=>{
 const cv=document.getElementById('game'),ctx=cv.getContext('2d'),scoreEl=document.getElementById('score'),hint=document.getElementById('hint'),overlay=document.getElementById('overlay'),egg=document.getElementById('egg'),eggText=document.getElementById('eggText'),surprise=document.getElementById('surprise'),replay=document.getElementById('replay'),lose=document.getElementById('lose');
 const image=new Image();image.src='venna.png';let W=0,H=0,dpr=1,frame=0,started=false,dead=false,pipes=[],score=0,eggTaps=0,eggReady=false,endedReveal=false,last=0;const b={x:0,y:0,vy:0,r:30};
 function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);b.x=W*.26;if(!started)b.y=H*.41}
 addEventListener('resize',size);size();
 function reset(){frame=0;started=false;dead=false;pipes=[];score=0;eggTaps=0;eggReady=false;endedReveal=false;b.x=W*.26;b.y=H*.41;b.vy=0;scoreEl.textContent='Towers escaped: 0';hint.style.display='block';overlay.classList.remove('show');egg.className='egg-holder';egg.style.display='';eggText.textContent='🥚 TAP THE EGG TWICE!';surprise.className='';replay.className='';lose.style.display='';overlay.querySelectorAll('.confetto').forEach(x=>x.remove())}
 function flap(){if(dead)return;started=true;hint.style.display='none';b.vy=-6.1}
 document.addEventListener('pointerdown',e=>{if(e.target.closest('#overlay'))return;e.preventDefault();flap()},{passive:false});
 egg.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!eggReady||endedReveal)return;eggTaps++;if(eggTaps===1){eggText.textContent='ONE MORE TAP, VENNA! 👀';egg.classList.remove('drop');egg.classList.add('hit');setTimeout(()=>{if(!endedReveal)egg.classList.remove('hit')},240)}else reveal()});
 replay.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();reset()});
 function hit(){if(dead)return;dead=true;overlay.classList.add('show');egg.className='egg-holder drop';egg.style.display='block';setTimeout(()=>{if(dead&&!endedReveal)eggReady=true},1080)}
 function reveal(){endedReveal=true;egg.classList.add('crack');lose.style.display='none';setTimeout(()=>{egg.style.display='none';surprise.className='fly';confetti();setTimeout(()=>replay.classList.add('show'),3100)},300)}
 function confetti(){let colors=['#feda5c','#ff6da8','#7ad7fb','#a4f89b','#fff','#aa85ff'];for(let i=0;i<65;i++){let el=document.createElement('div');el.className='confetto';el.style.left=Math.random()*100+'%';el.style.backgroundColor=colors[i%colors.length];el.style.animationDuration=(2.2+Math.random()*2.2)+'s';el.style.animationDelay=Math.random()*.6+'s';overlay.append(el);setTimeout(()=>el.remove(),5500)}}
 function background(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#3a276a');sky.addColorStop(.6,'#f17f90');sky.addColorStop(1,'#ffc08a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffda9c';ctx.beginPath();ctx.arc(W*.75,H*.25,46,0,7);ctx.fill();for(let j=0;j<3;j++){ctx.fillStyle=['#70466d','#514368','#372f5c'][j];let base=H*(.67+j*.075);for(let i=0;i<9;i++){let x=i*64-(frame*(.2+j*.25)%64),ht=(i*31+j*37)%120+40;ctx.fillRect(x,base-ht,48,ht+H);}}ctx.fillStyle='#292441';ctx.fillRect(0,H-43,W,43);ctx.fillStyle='#f8d783';for(let i=0;i<W;i+=44)ctx.fillRect(i-(frame*2%44),H-25,24,4)}
 function building(x,y,w,h,top){if(h<=0)return;ctx.fillStyle='#292c55';ctx.fillRect(x-2,y-2,w+4,h+4);ctx.fillStyle='#a0a7be';ctx.fillRect(x,y,w,h);ctx.fillStyle='#686f92';ctx.fillRect(x+w-12,y,12,h);ctx.fillStyle='#4a4b6e';for(let row=y+16;row<y+h-13;row+=28)for(let col=x+9;col<x+w-10;col+=22){ctx.fillStyle=(Math.floor(row+col)%3===0)?'#fadfa1':'#353959';ctx.fillRect(col,row,12,16)}let signY=top?y+h-37:y+9;ctx.fillStyle='#fff9ef';ctx.fillRect(x+3,signY,w-6,29);ctx.strokeStyle='#222448';ctx.lineWidth=2;ctx.strokeRect(x+3,signY,w-6,29);ctx.fillStyle='#df336c';ctx.font='900 19px system-ui';ctx.textAlign='center';ctx.fillText('TCS',x+w/2,signY+21)}
 function bird(){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.max(-.45,Math.min(.9,b.vy*.07)));let flap=Math.sin(frame*.5)*.55;for(let side of [-1,1]){ctx.save();ctx.translate(side*25,5);ctx.rotate(side*(flap-.25));ctx.fillStyle='#fff0cc';ctx.strokeStyle='#392444';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(side*15,0,25,12,side*.3,0,7);ctx.fill();ctx.stroke();ctx.restore()}ctx.save();ctx.beginPath();ctx.arc(0,0,b.r,0,7);ctx.clip();if(image.complete&&image.naturalWidth){ctx.drawImage(image,image.width*.30,image.height*.29,image.width*.41,image.height*.36,-b.r,-b.r,b.r*2,b.r*2)}else{ctx.fillStyle='#ffe1b8';ctx.fillRect(-b.r,-b.r,60,60)}ctx.restore();ctx.beginPath();ctx.arc(0,0,b.r,0,7);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();ctx.restore()}
 function draw(){background();pipes.forEach(p=>{building(p.x,0,p.w,p.top,true);building(p.x,p.bot,p.w,H-43-p.bot,false)});bird()}
 function step(){frame++;if(!dead){if(started){b.vy+=.34;b.y+=b.vy;if(frame%105===0){let gap=Math.max(178,Math.min(210,H*.27)),available=Math.max(35,H-100-gap-120),top=95+Math.random()*available;pipes.push({x:W+25,w:76,top,bot:top+gap,counted:false})}for(let p of pipes){p.x-=2.25;if(!p.counted&&p.x+p.w<b.x){p.counted=true;score++;scoreEl.textContent='Towers escaped: '+score}let closest=Math.max(p.x,Math.min(b.x,p.x+p.w));if(Math.abs(closest-b.x)<b.r*.75&&(b.y-b.r*.75<p.top||b.y+b.r*.75>p.bot))hit()}pipes=pipes.filter(p=>p.x+p.w>-10);if(b.y+b.r>H-43||b.y-b.r<0)hit()}else{b.y=H*.41+Math.sin(frame*.07)*8}}draw();requestAnimationFrame(step)}requestAnimationFrame(step);
})();
</script></body></html>
