<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#80d7ec">
<title>Venna Reddy vs TCS 💨</title>
<style>
:root { --ink:#19223a; --yellow:#ffe464; --pink:#ff5c8b; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; font-family:Impact,"Arial Black",system-ui,sans-serif; }
button { font:inherit; cursor:pointer; }
#app { position:relative; width:100%; height:100%; height:100dvh; overflow:hidden; background:#79cee6; touch-action:none; }
canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
#hud { position:absolute; top:max(14px,env(safe-area-inset-top)); left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:none; color:white; text-shadow:3px 3px 0 #28354c,-1px -1px 0 #28354c; }
#hud strong { font-size:clamp(19px,5.4vw,28px); letter-spacing:.4px; transform:rotate(-2deg); }
#score { font-size:23px; }
#hint { position:absolute; bottom:calc(40px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) rotate(-2deg); min-width:240px; text-align:center; background:var(--yellow); border:4px solid var(--ink); padding:12px 14px; border-radius:12px; box-shadow:5px 6px 0 #19223a; font-size:17px; color:var(--ink); pointer-events:none; }
#overlay { position:absolute; inset:0; display:none; z-index:5; background:rgba(15,28,49,.66); text-align:center; color:white; }
#overlay.active { display:block; }
#crashline { position:absolute; top:14%; left:4%; width:92%; font-size:clamp(22px,7vw,34px); line-height:1.1; color:var(--yellow); text-shadow:3px 4px 0 var(--ink); transform:rotate(-3deg); }
#crashline small { display:block; color:white; font-size:16px; margin-top:15px; }
#eggArea { position:absolute; top:-220px; left:50%; width:170px; height:212px; transform:translateX(-50%); transition:top 900ms cubic-bezier(.2,1.35,.5,1); }
#eggArea.landed { top:48%; }
#eggButton { position:relative; width:148px; height:178px; margin:0 auto; border:0; background:none; padding:0; display:block; touch-action:manipulation; filter:drop-shadow(0 9px 0 #21344c); }
.eggWhole { position:absolute; inset:0; background:radial-gradient(ellipse at 33% 24%, #fffdf6 0%,#fff1c0 44%,#e9be71 100%); border:5px solid var(--ink); border-radius:48% 48% 45% 45%/61% 61% 39% 39%; transition:opacity .08s; }
.eggWhole:before { content:'?'; position:absolute; top:52px; left:0; right:0; font-size:58px; color:#ff6093; -webkit-text-stroke:2px var(--ink); }
.eggHalf { position:absolute; left:0; width:100%; height:55%; opacity:0; background:#ffebad; border:5px solid var(--ink); }
.eggTop { top:0; border-radius:65% 65% 10% 10% / 92% 92% 8% 8%; clip-path:polygon(0 0,100% 0,100% 84%,84% 91%,69% 83%,52% 97%,35% 84%,16% 93%,0 82%); }
.eggBottom { bottom:0; border-radius:10% 10% 47% 47% / 8% 8% 92% 92%; clip-path:polygon(0 13%,18% 2%,35% 17%,52% 3%,68% 15%,84% 5%,100% 12%,100% 100%,0 100%); }
#eggButton.tap1 { animation:shake .4s ease; }
#eggButton.cracking .eggWhole { opacity:0; }
#eggButton.cracking .eggHalf { opacity:1; }
#eggButton.hatched .eggTop { animation:topCrack 1.1s ease-out forwards; }
#eggButton.hatched .eggBottom { animation:bottomCrack 1.1s ease-out forwards; }
#eggHelp { position:absolute; top:187px; left:50%; transform:translateX(-50%); width:270px; font-size:15px; line-height:1.3; text-shadow:2px 3px 0 var(--ink); }
@keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-12deg)} 50%{transform:rotate(9deg)} 75%{transform:rotate(-7deg)} }
@keyframes topCrack { to { transform:translate(-50px,-115px) rotate(-35deg); opacity:0; } }
@keyframes bottomCrack { to { transform:translate(50px,120px) rotate(40deg); opacity:0; } }
#spinPhoto { position:absolute; z-index:9; top:55%; left:50%; width:min(56vw,230px); aspect-ratio:4/5; display:none; border:7px solid white; box-shadow:9px 11px 0 var(--ink); border-radius:12px; object-fit:cover; transform:translate(-50%,-50%) rotate(0deg) scale(.2); }
#spinPhoto.go { display:block; animation:spinToSky 6.2s linear forwards; }
/* Exactly one hundred complete revolutions. */
@keyframes spinToSky { 0% { top:60%; transform:translate(-50%,-50%) rotate(0deg) scale(.35) } 100% { top:17%; transform:translate(-50%,-50%) rotate(36000deg) scale(1.12) } }
#final { position:absolute; inset:0; z-index:15; display:none; overflow:hidden; color:#22223a; background:radial-gradient(circle at 15% 17%,#fff7af 0 8%,transparent 9%),radial-gradient(circle at 80% 15%,#ffa7bc 0 10%,transparent 11%),linear-gradient(165deg,#fff2a9,#ffa9b8 60%,#cbabff); padding:calc(55px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom)); text-align:center; }
#final.show { display:flex; flex-direction:column; justify-content:center; align-items:center; animation:screenPop .5s ease-out; }
@keyframes screenPop { from{opacity:0;transform:scale(1.12)} to{opacity:1;transform:scale(1)} }
#final .sticker { background:#fff; border:5px solid #20283c; padding:9px 15px; transform:rotate(-5deg); font-size:clamp(29px,9vw,45px); line-height:1; box-shadow:7px 7px 0 #20283c; }
#final img { display:block; width:min(72vw,310px); height:min(40dvh,350px); object-fit:cover; object-position:center 32%; border:8px solid white; outline:4px solid #20283c; margin:23px auto; transform:rotate(4deg); box-shadow:8px 9px 0 #20283c; }
#final p { margin:5px 0 22px; font-family:system-ui,sans-serif; font-weight:900; font-size:clamp(18px,5.6vw,25px); line-height:1.3; }
#again { border:4px solid #20283c; background:#70f3a0; padding:12px 24px; color:#20283c; font-size:20px; border-radius:10px; box-shadow:5px 6px 0 #20283c; }
#soundTag { position:absolute; right:10px; bottom:calc(6px + env(safe-area-inset-bottom)); font:12px system-ui,sans-serif; color:rgba(22,35,57,.9); pointer-events:none; }
@media (min-width:700px) { #app { max-width:460px; margin:0 auto; box-shadow:0 0 0 100vw #182137; } }
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div id="hud"><strong>VENNA REDDY vs TCS 💨</strong><div id="score">0</div></div>
<div id="hint">TAP = GREEN GASTRIC BOOST 💨</div>
<div id="overlay" aria-live="polite">
  <div id="crashline">OPEN CHYI RA EE GUUDU NI 🥚<small>TCS tho crash ayyav ra 😂</small></div>
  <div id="eggArea">
    <button id="eggButton" aria-label="Tap twice to hatch the egg"><span class="eggWhole"></span><span class="eggHalf eggTop"></span><span class="eggHalf eggBottom"></span></button>
    <div id="eggHelp">EGG NI RENDU SAARLU TAP CHEY! 👆👆</div>
  </div>
</div>
<img id="spinPhoto" src="venna.png" alt="Venna Reddy spinning out of the egg">
<div id="final">
  <div class="sticker">HAPPY BIRTHDAY<br>VENNA REDDY! 🎂</div>
  <img src="venna.png" alt="Venna Reddy birthday photo">
  <p>TCS buildings kuda nee<br>sudhapusa ki haapppppy bday 💨</p>
  <button id="again">FLY AGAIN 💨</button>
</div>
<div id="soundTag">🔊 Tap for gas-powered flight</div>
</div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');
const hud=$('hud'),scoreEl=$('score'),hint=$('hint'),overlay=$('overlay'),eggArea=$('eggArea'),eggBtn=$('eggButton'),eggHelp=$('eggHelp'),spinPhoto=$('spinPhoto'),final=$('final');
const photo=new Image(); photo.src='venna.png';
let W=0,H=0,dpr=1,frame=0,last=0,spawnTimer=0,score=0,gameState='playing',taps=0,particles=[],towers=[];
let bird={x:100,y:260,vy:0,r:32,angle:0};
let audioCtx=null;
function initAudio(){
  try { const C=window.AudioContext||window.webkitAudioContext; if(!C)return; audioCtx ||=new C(); if(audioCtx.state==='suspended')audioCtx.resume(); } catch(e){}
}
// Short goofy synthesized gas sound; works without uploading an audio file.
// Audio starts only after touch, as required by mobile browsers.
function fart(){
 if(!audioCtx) return;
 const t=audioCtx.currentTime,d=.25;
 const osc=audioCtx.createOscillator(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();
 osc.type='sawtooth'; filter.type='lowpass'; filter.frequency.setValueAtTime(340,t);filter.frequency.exponentialRampToValueAtTime(110,t+d);
 osc.frequency.setValueAtTime(135+Math.random()*35,t);osc.frequency.exponentialRampToValueAtTime(48,t+d);
 gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.2,t+.018);gain.gain.exponentialRampToValueAtTime(.0001,t+d);
 osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+d+.01);
}
function boom(){ if(!audioCtx)return; const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type='triangle';osc.frequency.setValueAtTime(220,t);osc.frequency.exponentialRampToValueAtTime(55,t+.4);g.gain.setValueAtTime(.19,t);g.gain.exponentialRampToValueAtTime(.0001,t+.4);osc.connect(g);g.connect(audioCtx.destination);osc.start(t);osc.stop(t+.42); }
function resize(){
 W=innerWidth; H=innerHeight; dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
 bird.x=Math.min(95,W*.25);bird.r=Math.min(32,W*.085);
}
function reset(){
 gameState='playing';frame=0;last=0;spawnTimer=0;score=0;taps=0;particles=[];towers=[];
 bird.y=H*.43;bird.vy=0;bird.angle=0;scoreEl.textContent='0';hud.style.display='flex';hint.style.display='block';overlay.classList.remove('active');eggArea.classList.remove('landed');eggBtn.className='';eggHelp.textContent='EGG NI RENDU SAARLU TAP CHEY! 👆👆';spinPhoto.classList.remove('go');spinPhoto.style.display='none';final.classList.remove('show');
}
function gasBoost(){
 if(gameState!=='playing')return;
 initAudio();fart();bird.vy=-5.8;hint.style.display='none';
 for(let i=0;i<13;i++)particles.push({x:bird.x-bird.r*.7,y:bird.y+bird.r*.28,vx:-1.4-Math.random()*3.3,vy:(Math.random()-.5)*2.4,r:4+Math.random()*11,life:1,hue:i%3});
}
function spawnTower(){
 const gap=Math.min(210,Math.max(165,H*.27));const roof=H-64;
 const minTop=85,maxTop=Math.max(minTop+20,roof-gap-100);
 const top=minTop+Math.random()*(maxTop-minTop);
 towers.push({x:W+10,w:Math.max(67,Math.min(82,W*.19)),top,bottom:top+gap,passed:false});
}
function gameOver(){
 if(gameState!=='playing')return;
 gameState='dead';boom();hint.style.display='none';overlay.classList.add('active');eggArea.classList.remove('landed');eggBtn.className='';
 requestAnimationFrame(()=>requestAnimationFrame(()=>eggArea.classList.add('landed')));
}
function hatch(){
 if(gameState!=='dead'||!eggArea.classList.contains('landed'))return;
 initAudio();taps++;
 if(taps===1){eggBtn.classList.remove('tap1');void eggBtn.offsetWidth;eggBtn.classList.add('tap1');eggHelp.textContent='INKOKA TAP RA! 🥚';fart();return;}
 if(taps!==2)return;
 gameState='hatching';eggBtn.className='cracking hatched';eggHelp.textContent='kallu tirugutai jagratha 😂 ';
 setTimeout(()=>{
   overlay.style.pointerEvents='none';spinPhoto.style.display='block';void spinPhoto.offsetWidth;spinPhoto.classList.add('go');
 },850);
}
spinPhoto.addEventListener('animationend',ev=>{if(ev.animationName!=='spinToSky')return;gameState='final';overlay.classList.remove('active');overlay.style.pointerEvents='';spinPhoto.style.display='none';final.classList.add('show');burst();});
function burst(){
 const cols=['#ff5d7d','#ffe564','#6df5a4','#b0a2ff','#fff'];
 for(let i=0;i<75;i++){const e=document.createElement('i');e.style.cssText=`position:absolute;z-index:22;left:${Math.random()*100}%;top:-20px;width:${6+Math.random()*9}px;height:${8+Math.random()*13}px;background:${cols[i%cols.length]};pointer-events:none;transform:rotate(${Math.random()*360}deg);`; $('app').appendChild(e);e.animate([{transform:'translateY(0) rotate(0deg)'},{transform:`translateY(${H+45}px) rotate(${Math.random()*1000}deg)`}],{duration:1800+Math.random()*2200,fill:'forwards'}).onfinish=()=>e.remove(); }
}
function cloud(x,y,r,color='#fff'){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.arc(x+r*.7,y-r*.15,r*.7,0,Math.PI*2);ctx.arc(x-r*.6,y+r*.06,r*.65,0,Math.PI*2);ctx.fill();}
function backdrop(){
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#66c6ed');sky.addColorStop(.72,'#b2eef2');sky.addColorStop(1,'#f7efb2');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 for(let i=0;i<4;i++){let x=((i*156-frame*.25)%(W+190)+(W+190))%(W+190)-90;cloud(x,95+i%2*86,20+i%3*7,'#f4fdff');}
 ctx.fillStyle='#77b965';ctx.beginPath();ctx.moveTo(0,H-64);for(let x=0;x<=W+20;x+=12)ctx.lineTo(x,H-64-11*Math.sin(x*.026));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 ctx.fillStyle='#4c8059';ctx.fillRect(0,H-61,W,61);ctx.fillStyle='#9be17c';ctx.fillRect(0,H-65,W,10);
}
function building(x,y,w,h,fromTop){
 if(h<=0)return;
 ctx.save();ctx.fillStyle='#737b91';ctx.fillRect(x,y,w,h);ctx.fillStyle='#434e6c';ctx.fillRect(x+w-11,y,11,h);ctx.strokeStyle='#202b43';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);
 const start=y+22;
 for(let r=0;r<Math.ceil(h/30);r++){const wy=start+r*30; if(wy>y+h-17)break;for(let c=0;c<3;c++){const wx=x+10+c*(w-20)/3;ctx.fillStyle=(r+c)%4===0?'#9fd3e6':'#f9dc71';ctx.fillRect(wx,wy,Math.max(8,(w-30)/3),15);ctx.strokeStyle='#313a56';ctx.lineWidth=1;ctx.strokeRect(wx,wy,Math.max(8,(w-30)/3),15);}}
 let sy=fromTop?y+h-42:y+13;ctx.fillStyle='#fff';ctx.fillRect(x+4,sy,w-8,30);ctx.strokeStyle='#242b42';ctx.lineWidth=2;ctx.strokeRect(x+4,sy,w-8,30);ctx.fillStyle='#e12a53';ctx.font='900 22px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('TCS',x+w/2,sy+16);
 ctx.restore();
}
function drawTowers(){for(const t of towers){building(t.x,0,t.w,t.top,true);building(t.x,t.bottom,t.w,H-65-t.bottom,false);}}
function drawGas(){
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=['#48e767','#a9ff4d','#1ecb75'][p.hue];ctx.strokeStyle='#267a37';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1.25-p.life*.2),0,Math.PI*2);ctx.fill();ctx.stroke();}
 ctx.globalAlpha=1;
}
function drawBird(){
 ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.angle);
 const r=bird.r;
 // Comic wings are just decoration: only GREEN GAS makes him rise.
 ctx.fillStyle='#fff9ed';ctx.strokeStyle='#203049';ctx.lineWidth=3;
 for(const side of [-1,1]){ctx.save();ctx.translate(side*r*.88,-r*.1);ctx.rotate(side*(.25+.15*Math.sin(frame*.2)));ctx.beginPath();ctx.ellipse(side*r*.45,0,r*.63,r*.24,side*.3,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();}
 // Rotund comic body
 ctx.fillStyle='#fbc66f';ctx.beginPath();ctx.arc(0,r*.16,r*1.08,0,Math.PI*2);ctx.fill();ctx.stroke();
 // Face crop from the real birthday photo (roughly upper central face region).
 ctx.save();ctx.beginPath();ctx.arc(0,-r*.15,r*.8,0,Math.PI*2);ctx.clip();
 if(photo.complete&&photo.naturalWidth){const iw=photo.naturalWidth,ih=photo.naturalHeight;ctx.drawImage(photo,iw*.32,ih*.28,iw*.4,ih*.33,-r*.88,-r*1.04,r*1.76,r*1.76);}else{ctx.fillStyle='#eab68b';ctx.fillRect(-r,-r,r*2,r*2);}
 ctx.restore();ctx.beginPath();ctx.arc(0,-r*.15,r*.8,0,Math.PI*2);ctx.stroke();
 // tiny feet
 ctx.fillStyle='#ef7f38';ctx.fillRect(-r*.6,r*.95,11,10);ctx.fillRect(r*.25,r*.95,11,10);
 ctx.restore();
}
function intersects(t){
 const r=bird.r*.7;
 return bird.x+r>t.x && bird.x-r<t.x+t.w && (bird.y-r<t.top || bird.y+r>t.bottom);
}
function update(dt){
 frame+=dt;spawnTimer+=dt;
 if(gameState==='playing'){
  bird.vy+=.32*dt;bird.y+=bird.vy*dt;bird.angle=Math.max(-.42,Math.min(.75,bird.vy*.07));
  if(spawnTimer>Math.max(70,105-score*1.6)){spawnTimer=0;spawnTower();}
  for(const t of towers){t.x-=(2.3+Math.min(score*.04,.6))*dt;if(!t.passed&&t.x+t.w<bird.x){t.passed=true;score++;scoreEl.textContent=String(score);}if(intersects(t))gameOver();}
  towers=towers.filter(t=>t.x+t.w>-20);
  if(bird.y-bird.r<0||bird.y+bird.r>H-65)gameOver();
 }
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=.18*dt;p.life-=.035*dt;}particles=particles.filter(p=>p.life>0);
}
function tick(now){if(!last)last=now;const dt=Math.min(2.1,(now-last)/16.667);last=now;update(dt);backdrop();drawTowers();drawGas();if(gameState==='playing'||gameState==='dead')drawBird();requestAnimationFrame(tick);}
// Pointer down fires once per physical tap on touchscreens (no double-counting).
canvas.addEventListener('pointerdown',e=>{e.preventDefault();gasBoost();});
eggBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();hatch();});
$('again').addEventListener('click',()=>{overlay.style.pointerEvents='';reset();});
window.addEventListener('resize',()=>{resize();if(gameState==='playing')bird.y=Math.min(bird.y,H-110);});
resize();reset();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
